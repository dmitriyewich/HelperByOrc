name: Build HelperByOrc Win32

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release Win32
        working-directory: HelperByOrc
        shell: pwsh
        run: msbuild HelperByOrc.vcxproj /t:Build /p:Configuration=Release;Platform=Win32

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelperByOrc-Release-Win32
          path: HelperByOrc/Release/HelperByOrc.asi
          if-no-files-found: error
          retention-days: 30

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: HelperByOrc/Release/HelperByOrc.asi
